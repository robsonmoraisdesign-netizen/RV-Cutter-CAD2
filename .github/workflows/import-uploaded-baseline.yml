name: Import uploaded 14.22 archive

on:
  push:
    branches:
      - chore/import-14.22
    paths:
      - 'baseline-upload/RV_Cutter_CAD_14_22_CODIGO_FONTE.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: chore/import-14.22
          fetch-depth: 0

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=baseline-upload/RV_Cutter_CAD_14_22_CODIGO_FONTE.zip
          test -f "$ZIP"
          rm -rf /tmp/rv1422-upload
          mkdir -p /tmp/rv1422-upload
          unzip -q "$ZIP" -d /tmp/rv1422-upload

          ROOT="$(find /tmp/rv1422-upload -type f -path '*/src/ui.mjs' -printf '%h\n' | sed 's#/src$##' | head -n1)"
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/package.json" ]; then
            echo "::error::Could not locate 14.22 source root in uploaded archive."
            exit 1
          fi

          echo "Source root: $ROOT"
          grep -q '"version": "14.22.0"' "$ROOT/package.json"

          # Copy the original authorial source and QA assets. Generated runtime
          # remains derived from src/ and the locked manifold dependency.
          rsync -a "$ROOT/" ./             --exclude '.github/'             --exclude 'docs/'             --exclude 'README.md'             --exclude '.gitignore'             --exclude 'app/ui.js'             --exclude 'app/worker.js'             --exclude 'app/manifold.wasm'             --exclude 'audit-home.png'             --exclude 'audit-3d.png'             --exclude 'rose-fixed-cutter.stl'             --exclude 'rose-fixed-stamp.stl'

          rm -rf baseline-upload

      - name: Verify complete baseline assets
        shell: bash
        run: |
          set -euo pipefail
          for f in             src/ui.mjs src/editor.mjs src/geometry.mjs src/viewer.mjs src/worker.mjs             app/index.html app/main.cjs app/preload.cjs app/style.css             app/examples/pig.jpg app/examples/cow.jpg app/examples/flowers.png             test-pig-loops.json test-rose-loops.json fixtures/rosa-original.stl             rose-0-z3.json rose-0-z8.json rose-0-z10.json rose-0-z10.8.json             package.json package-lock.json; do
              test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

          test ! -e app/ui.js
          test ! -e app/worker.js
          test ! -e app/manifold.wasm
          grep -q '"version": "14.22.0"' package.json

      - name: Commit complete baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: complete 14.22 source and QA asset import"
          git push origin HEAD:chore/import-14.22
