name: RV Native Rust Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/native-rust-cad, feature/native-rust-sketch-preview]
    paths: ['native/**', '.github/workflows/native-rust-cad.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-rust-cad.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --manifest-path native/Cargo.toml --no-default-features
      - run: cargo build --manifest-path native/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: RV-Cutter-Native-Windows-Alpha
          path: |
            native/target/release/RV-Cutter-Native.exe
            native/README.md
            docs/licenses/
          if-no-files-found: error
