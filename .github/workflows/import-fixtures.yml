name: Import 14.22 QA Fixtures

on:
  push:
    branches:
      - chore/import-14.22
    paths:
      - '.fixture-import/part006.b64'

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[fixtures extracted]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: chore/import-14.22
          fetch-depth: 0

      - name: Reconstruct QA fixtures archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .fixture-import
          cat .fixture-import/part*.b64 | tr -d '\r\n' | base64 -d > /tmp/rv1422-qa-fixtures.tar.xz
          echo "fcb8c6fd6cf57a96249c2980e65895bf06acd4b0fc385716364b604e80e598ec  /tmp/rv1422-qa-fixtures.tar.xz" | sha256sum -c -
          tar -tJf /tmp/rv1422-qa-fixtures.tar.xz
          tar -xJf /tmp/rv1422-qa-fixtures.tar.xz -C .

      - name: Verify required QA fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f test-pig-loops.json
          test -f test-rose-loops.json
          test -f fixtures/rosa-original.stl
          test -f rose-0-z3.json
          test -f rose-0-z8.json
          test -f rose-0-z10.json
          test -f rose-0-z10.8.json

      - name: Remove staging archive
        shell: bash
        run: rm -rf .fixture-import

      - name: Commit extracted fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: import 14.22 QA fixtures [fixtures extracted]"
          git push origin HEAD:chore/import-14.22
