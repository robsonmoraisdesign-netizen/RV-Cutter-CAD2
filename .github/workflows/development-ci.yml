name: Development CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

concurrency:
  group: development-v2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build generated runtime
        run: npm run build

      - name: Copy Manifold WASM
        shell: node {0}
        run: |
          const fs=require('fs');
          const path=require('path');
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name);
              const st=fs.statSync(p);
              if(st.isDirectory()){const r=walk(p);if(r)return r;}
              else if(name==='manifold.wasm')return p;
            }
          }
          const wasm=walk(path.join(process.cwd(),'node_modules','manifold-3d'));
          if(!wasm)throw new Error('manifold.wasm not found');
          fs.copyFileSync(wasm,path.join(process.cwd(),'app','manifold.wasm'));

      - name: Syntax check
        shell: node {0}
        run: |
          const fs=require('fs');
          const path=require('path');
          const cp=require('child_process');
          const files=[];
          function walk(dir){
            for(const n of fs.readdirSync(dir)){
              const p=path.join(dir,n),s=fs.statSync(p);
              if(s.isDirectory())walk(p);
              else if(['.js','.mjs','.cjs'].includes(path.extname(n)))files.push(p);
            }
          }
          walk('src');walk('app');
          for(const f of files)cp.execFileSync(process.execPath,['--check',f],{stdio:'inherit'});
          console.log('Syntax OK:',files.length,'files');

      - name: Run QA
        run: npm test

      - name: Verify generated runtime
        shell: node {0}
        run: |
          const fs=require('fs');
          for(const p of ['app/ui.js','app/worker.js','app/manifold.wasm']){
            if(!fs.existsSync(p)||fs.statSync(p).size===0)throw new Error('Invalid generated artifact: '+p);
          }

      - name: Browser Sketch and lifecycle smoke
        if: runner.os == 'Linux'
        run: node qa-browser-cdp.cjs

      - name: Electron desktop smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path (Get-Location) 'desktop-smoke'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir | Out-Null
          $electron = Join-Path (Get-Location) 'node_modules\electron\dist\electron.exe'
          $p = Start-Process -FilePath $electron -ArgumentList @('app', "--rv-desktop-smoke=$dir") -Wait -PassThru
          $result = Join-Path $dir 'desktop-smoke.json'
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Electron desktop smoke failed with code $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'desktop-smoke.stl'))) { throw 'Desktop smoke STL was not saved' }

      - name: Upload Workspace UI audit
        continue-on-error: true
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-audit-14.27
          path: |
            audit-home-14.27.png
            audit-3d-14.27.png
            audit-sketch-14.27.png
            audit-presentation-14.27.png
          if-no-files-found: error
          retention-days: 14

      - name: Package Windows x64 application
        if: runner.os == 'Windows'
        env:
          RV_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/package-windows.cjs

      - name: Packaged Windows desktop smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path (Get-Location) 'packaged-desktop-smoke'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir | Out-Null
          $exe = Get-ChildItem -Path dist -Recurse -Filter 'RV Cutter CAD.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Packaged RV Cutter CAD.exe not found' }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--rv-desktop-smoke=$dir") -Wait -PassThru
          $result = Join-Path $dir 'desktop-smoke.json'
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Packaged Electron smoke failed with code $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'desktop-smoke.stl'))) { throw 'Packaged desktop smoke STL was not saved' }

      - name: Publish validated 14.28.7 Windows preview
        if: runner.os == 'Windows' && (github.head_ref || github.ref_name) == 'feature/14.28.7-multiimport-performance' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RV_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $folder = Join-Path 'dist' 'RV_Cutter_CAD_14.28.7_Windows_x64'
          $zip = Join-Path 'dist' 'RV_Cutter_CAD_14.28.7_Windows_x64.zip'
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  RV_Cutter_CAD_14.28.7_Windows_x64.zip" | Set-Content -Encoding ascii "$zip.sha256"
          $existing = gh release view v14.28.7-preview --json targetCommitish,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if ($release.targetCommitish -ne $env:RV_RELEASE_SHA) { throw 'Preview tag already belongs to another commit; refusing to overwrite' }
            if (($release.assets.name -contains 'RV_Cutter_CAD_14.28.7_Windows_x64.zip') -and ($release.assets.name -contains 'RV_Cutter_CAD_14.28.7_Windows_x64.zip.sha256')) { exit 0 }
            throw 'Existing preview release is incomplete; inspect before replacing assets'
          }
          gh release create v14.28.7-preview $zip "$zip.sha256" --target $env:RV_RELEASE_SHA --prerelease --title 'RV Cutter CAD 14.28.7 — Windows x64' --notes-file docs/REVISAO-14.28.7.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish preview release' }

      - name: Upload Windows x64 application
        continue-on-error: true
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RV_Cutter_CAD_Windows_x64
          path: dist/RV_Cutter_CAD_*_Windows_x64
          if-no-files-found: error
          retention-days: 30

