[package]
name = "rv-sketch-core"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.105"
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
[profile.release]
opt-level = "s"
lto = true
