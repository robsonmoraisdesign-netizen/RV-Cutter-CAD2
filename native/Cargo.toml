[package]
name = "rv-cutter-native"
version = "15.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
publish = false
[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui", "dep:rfd", "dep:solidcraft-ui-egui"]
[[bin]]
name = "RV-Cutter-Native"
path = "src/main.rs"
required-features = ["desktop"]
[dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
egui = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }
solidcraft-engine = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
solidcraft-ui-egui = { path = "vendor/solidcraft/crates/ui-egui", optional = true }

[patch.crates-io]
truck-geometry = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
truck-shapeops = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
truck-stepio = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
truck-meshalgo = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
matext4cgmath = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }
egui-wgpu = { git = "https://github.com/tangency-labs/solidcraft", rev = "fa691707c224cae580c42201ed3a22d5e4b8c716" }

[profile.dev]
debug = 0
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
strip = true

